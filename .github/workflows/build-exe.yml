# Builds the Windows installer + portable .exe on every push.
# Download them from the run's "Artifacts". Pushing a tag like v1.1.0 also makes a GitHub Release.
name: Build App Hub .exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  clipforge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClipForge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ClipForge/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  windows:
    needs: clipforge-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-hub/package-lock.json
      - run: npm ci
      - run: npm test
      # Grammar and Agent Dashboard ship inside App Hub (My Apps); CI=false: their React build must not stop on warnings
      - run: npm run build:apps
        env:
          CI: 'false'
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Clean up old artifacts before uploading to avoid hitting storage quotas
      - name: Delete old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/actions/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name != "App-Hub-windows") | .id' \
            | while read id; do
                gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/${id}" > /dev/null 2>&1 || true
              done
      - uses: actions/upload-artifact@v4
        with:
          name: App-Hub-windows
          path: app-hub/dist/*.exe
          retention-days: 7
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-hub/dist/*.exe
