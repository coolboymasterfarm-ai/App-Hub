# Builds the Windows installer + portable .exe on every push.
# Download them from the run's "Artifacts". Pushing a tag like v1.1.0 also makes a GitHub Release.
name: Build App Hub .exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-hub/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx electron-builder --config clipforge.builder.js --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: App-Hub-windows
          path: app-hub/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-hub/dist/*.exe
