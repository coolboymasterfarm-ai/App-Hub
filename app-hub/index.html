<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>App Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* App Hub Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      height: 56px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-right: 40px;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    .tab {
      padding: 8px 20px;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab:hover { background: #2a2a2a; color: #fff; }
    .tab.active { background: #0066cc; color: #fff; }

    main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #home-view {
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
    }

    #home-view h2 {
      margin-bottom: 24px;
      font-size: 24px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }

    .tile {
      aspect-ratio: 1;
      background: #1e1e1e;
      border: 2px dashed #444;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tile:hover {
      border-color: #0066cc;
      background: #2a2a2a;
      transform: translateY(-2px);
    }

    .tile-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .tile-label {
      font-size: 13px;
      color: #aaa;
    }

    #clipforge-view {
      width: 100%;
      height: 100%;
      display: none;
    }

    #clipforge-view iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* App Grid for installed apps */
    .app-tile {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #333;
    }

    .app-tile:hover {
      border-color: #0066cc;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 102, 204, 0.2);
    }

    .app-tile-icon {
      font-size: 48px;
    }

    .app-tile-name {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header>
    <h1>App Hub</h1>
    <nav>
      <button id="tab-home" class="tab active">Home</button>
      <button id="tab-clipforge" class="tab">ClipForge</button>
    </nav>
  </header>
  
  <main>
    <!-- Home View -->
    <div id="home-view">
      <h2>Your Apps</h2>
      <div class="apps-grid" id="apps-grid">
        <div class="app-tile" onclick="window.electronAPI.openApp('clipforge')">
          <div class="app-tile-icon">🎬</div>
          <div class="app-tile-name">ClipForge</div>
        </div>
        <div class="app-tile" id="add-app-tile">
          <div class="app-tile-icon">+</div>
          <div class="app-tile-name">Add App</div>
        </div>
      </div>
    </div>
    
    <!-- ClipForge View -->
    <div id="clipforge-view">
      <iframe src="clipforge-tab.html" id="clipforge-frame"></iframe>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
