<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Writing Assistant</h1>
            <p>Improve your writing with AI-powered grammar, spelling, and style checks</p>
        </header>
        
        <main>
            <div class="input-section">
                <label for="writing-input">Your Text:</label>
                <textarea 
                    id="writing-input" 
                    placeholder="Paste or type your writing here to get suggestions..."
                    rows="10"
                ></textarea>
                <div class="counter">
                    Characters: <span id="char-count">0</span> | 
                    Words: <span id="word-count">0</span>
                </div>
            </div>
            
            <button id="check-btn" class="primary-btn">Check Writing</button>
            
            <div id="results-section" class="hidden">
                <div id="loading-state" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Analyzing your writing...</p>
                </div>
                
                <div id="error-state" class="error hidden">
                    <p>Unable to check writing. Please try again.</p>
                </div>
                
                <div id="suggestions-content">
                    <!-- Suggestions will be populated here by JavaScript -->
                </div>
                
                <div class="actions">
                    <button id="apply-all-btn" class="secondary-btn">Apply All Suggestions</button>
                    <button id="copy-btn" class="secondary-btn">Copy Corrected Text</button>
                    <button id="download-btn" class="secondary-btn">Download as .txt</button>
                </div>
                
                <div id="preview-section">
                    <h3>Preview:</h3>
                    <div id="preview-text" class="preview-box"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="freellm.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
