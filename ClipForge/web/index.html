<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge</title>
<style>
/* Design tokens - shared with App Hub (same neutrals, radii and type), ClipForge keeps its yellow. */
:root{
  --bg:#0a0b0e;--bg2:#0e1014;--panel:#13151a;--panel2:#191c22;--hover:#20242c;--line:#252932;--line2:#323845;
  --text:#eceef2;--mut:#8a91a0;--dim:#5d6472;
  --acc:#ffd400;--acc-h:#ffe04d;--acc-ink:#141100;--acc-soft:rgba(255,212,0,.12);--acc2:#39ff88;
  --bad:#ff5a5f;--bad-soft:rgba(255,90,95,.12);--ok:#39d98a;--ok-soft:rgba(57,217,138,.12);--warn:#ffb020;
  --r1:8px;--r2:12px;--r3:16px;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 12px 32px rgba(0,0,0,.32);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
::selection{background:rgba(255,212,0,.3)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#262a33;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#343a46;background-clip:padding-box;border:2px solid transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{cursor:pointer;border:1px solid transparent;border-radius:var(--r1);padding:8px 13px;background:var(--panel2);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s,transform .06s,color .15s}
button:hover{background:var(--hover);border-color:var(--line2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri,a.pri{background:var(--acc);color:var(--acc-ink);font-weight:650;border-color:transparent}
button.pri:hover,a.pri:hover{background:var(--acc-h)}
button.ghost{background:transparent;border-color:var(--line)}
button.ghost:hover{background:var(--panel2);border-color:var(--line2)}
button.quiet{background:transparent;border-color:transparent;color:var(--mut)}
button.quiet:hover{background:var(--panel2);color:var(--text)}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad-soft);border-color:rgba(255,90,95,.35)}
button.icon{padding:7px;border-radius:var(--r1)}
a.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r1);padding:8px 13px;text-decoration:none;font-weight:650}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:8px 11px;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#5a6378;box-shadow:0 0 0 3px var(--acc-soft)}
a{color:var(--acc)}
kbd{font:11px/1 var(--font);padding:2px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;color:var(--mut)}

/* ---------------------------------------------------------------- layout */
.app{display:grid;grid-template-columns:264px 1fr;height:100vh;height:100dvh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;font-weight:750;font-size:15.5px;letter-spacing:.1px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#ff8a00);display:grid;place-items:center;color:var(--acc-ink);box-shadow:0 4px 14px rgba(255,170,0,.25)}
.logo svg{width:17px;height:17px;stroke-width:2.4}
.newbtn{margin:0 12px 10px;width:calc(100% - 24px);padding:10px}
.search{margin:0 12px 8px;position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{width:100%;padding:7px 10px 7px 32px;background:var(--panel);font-size:13px}
.plabel{padding:8px 20px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:600}
.plist{overflow:auto;flex:1;padding:0 8px 12px}
.pitem{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent;position:relative}
.pitem:hover{background:var(--panel)}
.pitem.on{background:var(--panel2);border-color:var(--line)}
.pitem img,.pitem .ph{width:58px;height:33px;border-radius:6px;object-fit:cover;background:#1b1e24;flex:none}
.pitem .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.pitem .s{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.sdot.run{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}.sdot.ok{background:var(--ok)}.sdot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.side-foot{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pill{font-size:11.5px;padding:5px 8px;border-radius:8px;background:var(--panel);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
main{overflow:auto;min-height:0;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;padding:26px 28px 56px}

/* ---------------------------------------------------------------- home */
.hero{padding:44px 0 6px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--acc);background:var(--acc-soft);border:1px solid rgba(255,212,0,.25);padding:4px 11px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:40px;line-height:1.08;margin:0 0 12px;letter-spacing:-1px;font-weight:750}
.hero h1 span{background:linear-gradient(90deg,var(--acc),#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 auto 26px;max-width:580px;font-size:15px}
.drop{border:1.5px dashed #2f3540;border-radius:20px;padding:16px;background:var(--panel);max-width:760px;margin:0 auto;box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--acc);background:#18170f}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow textarea{flex:1;padding:13px 15px;font-size:15px;border-radius:12px;resize:none;min-height:50px;max-height:150px;line-height:1.4}
.inrow button.pri{padding:0 20px;font-size:14.5px;border-radius:12px;white-space:nowrap}
.or{color:var(--mut);font-size:13px;margin:12px 0 0}
.or button{background:none;border:none;color:var(--acc);padding:0;text-decoration:underline;display:inline}
.more{margin-top:12px;text-align:left}
.more summary{cursor:pointer;color:var(--mut);font-size:13px;list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px}
.more summary:hover{color:var(--text)}
.more summary::-webkit-details-marker{display:none}
.more .caret{transition:transform .18s}.more[open] .caret{transform:rotate(180deg)}
.more .mrow{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;margin-top:12px}
.more label,.opt label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.more input{width:100%}
.opts-summary{color:var(--text);opacity:.72;font-size:12.5px}
.opts-summary:empty{display:none}
/* Chromium keeps an explicitly displayed child of a closed <details> laid out, so both states are explicit. */
.more-opts > .opts{display:none;margin-top:14px;gap:14px;flex-wrap:wrap;align-items:flex-end}
.more-opts[open] > .opts{display:flex}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--mut);border:none}
.seg button:hover{color:var(--text);background:transparent}
.seg button.on{background:#2c313c;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:960px;margin:34px auto 0}
.feat>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;text-align:left}
.feat .fi{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin-bottom:10px}
.feat b{display:block;margin-bottom:3px;font-size:13.5px}
.feat span{color:var(--mut);font-size:12.5px}
.recent{max-width:960px;margin:36px auto 0;text-align:left}
.recent h3{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:0 0 12px;font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.rcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.rcard img,.rcard .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#1b1e24}
.rcard div{padding:9px 11px}
.rcard b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard span{font-size:12px;color:var(--mut)}

/* ---------------------------------------------------------------- project */
.phead{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.phead h2{margin:0 0 5px;font-size:22px;line-height:1.25;letter-spacing:-.3px}
.phead .sub{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.jobcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.step{min-width:0;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:8px 9px}
.step i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#0f1115;font-style:normal;font-size:11px;font-weight:700;flex:none}
.step.on{color:var(--text);border-color:rgba(255,212,0,.4);background:#1f1c10}
.step.on i{background:var(--acc);color:var(--acc-ink)}
.step.done{color:#c9d4cc}.step.done i{background:#1d3a2a;color:var(--ok)}
.bar{height:7px;border-radius:99px;background:#0d0f13;overflow:hidden;border:1px solid #20242c}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff9d00);transition:width .45s ease;border-radius:99px}
.jobline{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:12px;font-size:13px}
.jobmeta{min-width:0}.jobmeta b{font-weight:650}.jobline .st{color:var(--mut)}
.queue{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);background:var(--panel2);border-radius:8px;padding:7px 10px}
.qrow b{color:var(--text);font-weight:600}
.qbadge{margin-left:auto;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:#c8a84a;background:#2a2412;border-radius:99px;padding:2px 8px}
details.log{margin-top:10px}
details.log summary{cursor:pointer;color:var(--mut);font-size:12.5px}
details.log pre,.txpre{background:#08090b;border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font:12px/1.5 Consolas,monospace;color:#b9c0cc;white-space:pre-wrap;margin:8px 0 0}
.err{background:var(--bad-soft);border:1px solid rgba(255,90,95,.35);color:#ffc2c4;border-radius:var(--r2);padding:12px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center}
.err span{flex:1}
.toolbar{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.vtabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.vtabs button{background:transparent;border:none;color:var(--mut);padding:6px 14px;border-radius:8px;font-size:13px}
.vtabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.vtabs .n{font-size:11px;background:#262a33;border-radius:99px;padding:1px 7px;color:var(--mut)}
.toolbar .sp{flex:1}
.toolbar select{padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.clip:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.vid{position:relative;aspect-ratio:9/16;background:#060709;cursor:pointer;overflow:hidden}
.vid video,.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;background:linear-gradient(transparent 55%,rgba(0,0,0,.5))}
.vid:hover .play{opacity:1}
.vid .play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.vid .play svg{width:22px;height:22px;fill:#fff;stroke:none;margin-left:3px}
.vid .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;padding:20px;cursor:default}
.spin{width:28px;height:28px;border:3px solid #2a2e37;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{position:absolute;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:650;border:1px solid rgba(255,255,255,.08)}
.score{top:10px;left:10px;font-weight:800;font-size:13px}
.score.hi{color:var(--acc2)}.score.mid{color:var(--acc)}.score.lo{color:#ddd}.score.you{color:#c7b8ff}
.dur{top:10px;right:10px;font-weight:600}
.tag{bottom:10px;left:10px;font-weight:600}
.cbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.ctitle{font-weight:700;font-size:15px;line-height:1.3}
.why{color:var(--mut);font-size:12.5px}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.subs div{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.subs i{display:block;height:4px;border-radius:4px;background:var(--panel2);margin-top:3px;overflow:hidden}
.subs i b{display:block;height:100%;background:var(--acc)}
.cacts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.cacts .pri{flex:1}
.cacts button,.cacts a{padding:8px 10px;font-size:13px;text-decoration:none;color:var(--text);border-radius:10px;background:var(--panel2);border:1px solid transparent}
.cacts button:hover,.cacts a:hover{background:var(--hover)}
.cacts a.pri{background:var(--acc);color:var(--acc-ink)}
.cacts a.pri:hover{background:var(--acc-h)}
.editor{display:none;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:11px}
.editor.open{display:flex}
.editor label{font-size:12px;color:var(--mut)}
.trim{display:grid;grid-template-columns:1fr;gap:8px}
.nud{display:flex;align-items:center;gap:4px}
.nud input{flex:1;width:0;min-width:60px;text-align:center;padding:7px 4px}
.nud button{padding:6px 9px}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{font-size:12px;padding:5px 10px;border-radius:99px;text-align:left}
.capedit{width:100%;resize:vertical;font-size:12.5px;line-height:1.45}
.more-acts{display:flex;gap:6px;flex-wrap:wrap}
.more-acts>*{font-size:12px;padding:6px 10px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.empty svg{width:34px;height:34px;color:var(--dim);margin-bottom:8px}

/* ---------------------------------------------------------------- transcript */
.tx{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.txbody{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:8px;max-height:calc(100vh - 230px);overflow:auto}
.txs{display:flex;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;line-height:1.55;border:1px solid transparent}
.txs:hover{background:var(--panel2)}
.txs .ts{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;flex:none;width:42px;padding-top:2px}
.txs.sel{background:#22200f;border-color:rgba(255,212,0,.3)}
.txs.inclip .ts{color:var(--acc)}
.txs.anchor{border-color:var(--acc)}
.txside{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:14px}
.card h4{margin:0 0 8px;font-size:14px}
.card video{width:100%;border-radius:10px;background:#000;display:block}
.hint{color:var(--mut);font-size:12.5px}
.selinfo{font-size:13px;margin:6px 0 10px}
.selinfo b{font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- overlays */
.modal{position:fixed;inset:0;background:rgba(4,5,7,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.open{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(800px,100%);max-height:min(88vh,800px);display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.sheet header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.sheet header h3{margin:0;flex:1;font-size:16px}
.sheet .tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line)}
.sheet .tabs button{background:transparent;color:var(--mut);border-radius:8px 8px 0 0;border:none;border-bottom:2px solid transparent;padding:8px 12px}
.sheet .tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.sheet .body{padding:18px 20px;overflow:auto}
.sheet footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sheet footer .note{margin-right:auto;color:var(--mut);font-size:12.5px}
.fg{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px 18px;align-items:center}
.fg .h{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin-top:8px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fg label{color:#d3d7df}
.fg input[type=text],.fg input[type=password]{width:100%}
.fg small{display:block;color:var(--mut);font-size:12px}
.sw{position:relative;width:42px;height:24px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#343944;border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(18px);background:var(--acc-ink)}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.aibox{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.75}
.player{width:min(980px,100%);max-height:94vh;display:grid;grid-template-columns:auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:rise .18s ease}
.player video{height:min(86vh,760px);aspect-ratio:9/16;background:#000;display:block}
.pinfo{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.pinfo h3{margin:0;font-size:19px;line-height:1.3}
.pinfo .desc{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap;color:#d6dae2}
.pnav{display:flex;gap:6px;margin-top:auto;align-items:center}
.pnav .sp{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#232731;border:1px solid #333a47;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:80vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){.tx{grid-template-columns:1fr}.txside{position:static;order:-1}.txbody{max-height:none}}
@media (max-width:980px){.feat{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}.player{grid-template-columns:1fr}.player video{height:auto;width:100%;max-height:60vh}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}aside{display:none}
  .wrap{padding:16px 14px 40px}.hero{padding:20px 0 4px}.hero h1{font-size:30px}
  .fg{grid-template-columns:1fr}.phead{flex-direction:column}.phead .acts{margin-left:0;justify-content:flex-start}.jobline{flex-wrap:wrap}
  .more .mrow{grid-template-columns:1fr}
}
@media (max-width:520px){.feat{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.inrow{flex-direction:column}.inrow button.pri{padding:11px 14px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}main{scroll-behavior:auto}}

<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg class="i"><use href="#i-scissors"/></svg></div>ClipForge</div>
    <button class="pri newbtn" onclick="go('')"><svg class="i"><use href="#i-plus"/></svg>New video</button>
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Search videos" oninput="Q=this.value.toLowerCase();paintList()" aria-label="Search videos"></div>

    <div class="plist" id="plist"></div>
    <div class="side-foot">
      <div class="pills" id="pills"></div>

</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeSettings()">

    <footer><span class="note" id="snote">Changes apply to the next clips you make (or re-render).</span>
      <button class="ghost" onclick="closeSettings()">Cancel</button>
      <button class="pri" onclick="saveSettings()">Save</button></footer>
  </div>
</div>
<div class="modal" id="pmodal" onclick="if(event.target===this)closePlayer()"><div id="pbox"></div></div>
<input type="file" id="file" accept="video/*,.mkv,.mov,.webm" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: opts.body && !(opts.body instanceof FormData) ? {"Content-Type": "application/json"} : {}, ...opts});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
};
const fmt = s => { s = Math.max(0, s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(Math.floor(s % 60)).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const ago = t => { const d = Date.now() / 1000 - t; return d < 60 ? "just now" : d < 3600 ? Math.floor(d / 60) + " min ago" : d < 86400 ? Math.floor(d / 3600) + " h ago" : Math.floor(d / 86400) + " d ago"; };
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
let S = {}, ST = null, cur = null, P = null, openEd = new Set(), lastSig = "", LIST = [], Q = "";
let VIEW = store("cf-view") || "clips", SORT = store("cf-sort") || "score";
function toast(m, ms = 2600) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }

// ------------------------------------------------------------ routing
function go(pid) { location.hash = pid ? "#/p/" + pid : "#/"; }
window.addEventListener("hashchange", route);
function route() {
  const m = location.hash.match(/^#\/p\/(\w+)/);
  if ((m ? m[1] : null) !== cur) TX = null;
  cur = m ? m[1] : null; P = null; lastSig = ""; openEd.clear();
  cur ? loadProject() : home();
  loadList();
}

// ------------------------------------------------------------ sidebar
const SLABEL = {queued:"Waiting",downloading:"Downloading",transcribing:"Transcribing",finding:"Finding moments",
  rendering:"Editing",done:"Ready",error:"Failed",cancelled:"Stopped"};
const sdot = s => s === "done" ? "ok" : s === "error" ? "bad" : s === "cancelled" ? "" : "run";
async function loadList() { LIST = await api("/api/projects").catch(() => LIST); paintList(); }
function paintList() {
  const list = LIST.filter(p => !Q || (p.title || "").toLowerCase().includes(Q));
  const sig = JSON.stringify([list, cur, Q]);   // the poll asks every 1.5 s; redraw (and reload thumbnails) only on a change
  if (sig === paintList.sig) return;
  paintList.sig = sig;
  $("#plist").innerHTML = list.length ? list.map(p => `
    <div class="pitem ${p.id === cur ? "on" : ""}" onclick="go('${p.id}')" title="${esc(p.title)}">
      ${p.thumb ? `<img src="/files/${p.id}/${p.thumb}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <div style="min-width:0"><div class="t">${esc(p.title)}</div>
      <div class="s"><span class="sdot ${sdot(p.status)}"></span>${SLABEL[p.status] || p.status}${p.clips ? " · " + p.clips + " clips" : ""}</div></div>
    </div>`).join("") : `<div class="empty" style="font-size:13px;padding:24px 8px">${Q ? "No videos match" : "Your videos show up here"}</div>`;
}
async function loadStatus(fresh) {
  try { ST = await api("/api/status" + (fresh ? "?fresh=1" : "")); } catch { return; }
  const a = ST.ai, ai = a.provider === "omniroute" ? ["ok", "OmniRoute"] : a.provider === "ollama" ? ["ok", a.model] : ["warn", "Built-in"];
  $("#pills").innerHTML = `
    <span class="pill" title="Who picks and titles the clips"><span class="dot ${ai[0]}"></span>AI <b>${esc(ai[1])}</b></span>
    <span class="pill" title="Speech to text"><span class="dot ${ST.whisper.device === "cuda" ? "ok" : "warn"}"></span>Speech <b>${ST.whisper.device === "cuda" ? "GPU" : "CPU"}</b></span>
    <span class="pill" title="Caption renderer"><span class="dot ${ST.hyperframes ? "ok" : "warn"}"></span><b>${ST.hyperframes ? "HyperFrames" : "Basic captions"}</b></span>
    <span class="pill" title="Video encoder"><span class="dot ${ST.ffmpeg ? "ok" : "bad"}"></span>Encode <b>${ST.encoder === "nvenc" ? "NVENC" : "x264"}</b></span>`;
}

// ------------------------------------------------------------ home
function segCtl(key, opts) {
  return `<div class="seg" data-k="${key}">${opts.map(([v, l]) => `<button class="${String(S[key]) === String(v) ? "on" : ""}" onclick="quick('${key}','${v}',this)">${l}</button>`).join("")}</div>`;
}
let OPTS = {caption_styles: [], transitions: []};   // from /api/options - the server owns these lists
async function quick(k, v, el) {
  const val = k === "clip_count" ? +v : v;
  if (el) el.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el));
  S = await api("/api/settings", {method: "POST", body: JSON.stringify({[k]: val})});
  paintOptsSummary();
}
function home() {
  const recent = LIST.slice(0, 4);
  $("#main").innerHTML = `<div class="wrap">
    <div class="hero">
      <div class="eyebrow">${ic("spark")}Everything runs on this PC</div>
      <h1>Long video in.<br><span>Viral clips</span> out.</h1>
      <p>Paste a YouTube link or drop a video. ClipForge transcribes it, has AI pick the moments worth posting, follows the speaker into 9:16, cuts the dead air and adds animated captions.</p>
      <div class="drop" id="drop">
        <div class="inrow">
          <textarea id="url" rows="1" placeholder="Paste a YouTube link (one per line for several)" autocomplete="off" aria-label="Video link"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();start()}"></textarea>
          <button class="pri" id="gobtn" onclick="start()">${ic("wand")}Make clips</button>
        </div>
        <div class="or">or <button onclick="$('#file').click()">choose a video file</button>, or drag one onto this box</div>
        <details class="more" id="more"><summary>What to look for, which part of the video ${ic("chev", "caret")}</summary>
          <div class="mrow">
            <div><label for="topic">Clips about (optional)</label><input id="topic" maxlength="200" placeholder="e.g. his story about the fight, money advice…"></div>
            <div><label for="from">From (minute)</label><input id="from" inputmode="decimal" placeholder="0"></div>
            <div><label for="to">To (minute)</label><input id="to" inputmode="decimal" placeholder="end"></div>
          </div>
        </details>
        <details class="more more-opts" id="outopts">
          <summary>Output options <span class="opts-summary" id="opts-summary"></span>${ic("chev", "caret")}</summary>
          <div class="opts">
            <div class="opt"><label>Clips</label>${segCtl("clip_count", [[3,"3"],[5,"5"],[8,"8"],[12,"12"]])}</div>
            <div class="opt"><label>Length</label>${segCtl("clip_length", [["short","15–35s"],["medium","25–60s"],["long","45–90s"]])}</div>
            <div class="opt"><label>Captions</label><select onchange="quick('caption_style',this.value)" aria-label="Caption style">${OPTS.caption_styles.map(([v, l]) =>
              `<option value="${v}" ${S.caption_style === v ? "selected" : ""}>${l.split(" - ")[0]}</option>`).join("")}</select></div>
            <div class="opt"><label>Caption spot</label>${segCtl("caption_position", [["auto","Auto"],["top","Top"],["middle","Middle"],["bottom","Bottom"]])}</div>
            <div class="opt"><label>Title</label>${segCtl("hook_style", [["card","Card"],["slam","Slam"],["type","Type"]])}</div>
          </div>
        </details>
      </div>
      <div class="feat">
        <div><div class="fi">${ic("spark")}</div><b>AI clip picker</b><span>OmniRoute or local Ollama rates every moment like a producer</span></div>
        <div><div class="fi">${ic("face")}</div><b>Face tracking</b><span>Follows whoever is talking, holds still between cuts</span></div>
        <div><div class="fi">${ic("film")}</div><b>Motion graphics</b><span>10 caption styles, animated hook titles, stat cards, emojis</span></div>
        <div><div class="fi">${ic("scissors")}</div><b>Tight edit</b><span>Dead air and ums removed, punch-in zooms, loudness to −14 LUFS</span></div>
      </div>
      ${recent.length ? `<div class="recent"><h3>Recent videos</h3><div class="rgrid">${recent.map(p => `
        <div class="rcard" onclick="go('${p.id}')">${p.thumb ? `<img src="/files/${p.id}/${p.thumb}" alt="" loading="lazy">` : `<div class="ph"></div>`}
          <div><b>${esc(p.title)}</b><span>${SLABEL[p.status] || p.status}${p.clips ? " · " + p.clips + " clips" : ""} · ${ago(p.created)}</span></div></div>`).join("")}</div></div>` : ""}
    </div></div>`;
  const d = $("#drop");
  ["dragenter", "dragover"].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", ev => ev.dataTransfer.files[0] && upload(ev.dataTransfer.files[0]));
  paintOptsSummary();
  setTimeout(() => $("#url") && $("#url").focus(), 50);
}
// Restate the output settings in the closed disclosure, so hiding the controls doesn't hide the choice.
function paintOptsSummary() {
  const box = $("#opts-summary");
  if (!box) return;
  const on = k => { const b = document.querySelector(`.seg[data-k="${k}"] button.on`); return b ? b.textContent.trim() : null; };
  const sel = $("#outopts select");
  const cap = sel && sel.selectedOptions[0] ? sel.selectedOptions[0].textContent.trim() : null;
  const n = on("clip_count"), hook = on("hook_style");
  const bits = [n && n + " clips", on("clip_length"), cap && cap + " captions", hook && hook + " titles"].filter(Boolean);
  box.textContent = bits.length ? "· " + bits.join(" · ") : "";
}
async function start() {
  const v = $("#url").value.trim();
  if (!v) return toast("Paste a YouTube link first");
  $("#gobtn").disabled = true;
  try {
    const r = await api("/api/projects", {method: "POST", body: JSON.stringify({input: v, ...extras()})});
    if (r.count > 1) toast(r.count + " videos queued - they run one after another", 4000);
    go(r.project);
  } catch (e) { toast(e.message, 5000); $("#gobtn").disabled = false; }
}
$("#file").addEventListener("change", e => e.target.files[0] && upload(e.target.files[0]));
function extras() {
  return {topic: $("#topic")?.value.trim() || "", from_min: $("#from")?.value.trim() || "", to_min: $("#to")?.value.trim() || ""};
}
function upload(f) {
  const fd = new FormData(); fd.append("file", f);
  Object.entries(extras()).forEach(([k, v]) => fd.append(k, v));
  const x = new XMLHttpRequest();
  x.open("POST", "/api/upload");
  $("#main").innerHTML = `<div class="wrap"><div class="jobcard"><b>Uploading ${esc(f.name)}</b>
    <div class="bar" style="margin-top:12px"><i id="upbar"></i></div><div class="jobline"><span class="st" id="uptxt">0%</span></div></div></div>`;
  x.upload.onprogress = e => { if (e.lengthComputable) { const p = e.loaded / e.total * 100; $("#upbar").style.width = p + "%"; $("#uptxt").textContent = p.toFixed(0) + "% of " + (e.total / 1e9).toFixed(2) + " GB"; } };
  x.onload = () => { try { const d = JSON.parse(x.responseText); if (x.status >= 400) throw new Error(d.detail); go(d.project); } catch (e) { toast(e.message || "Upload failed", 5000); home(); } };
  x.onerror = () => { toast("Upload failed", 5000); home(); };
  x.send(fd);
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); if (!cur && e.dataTransfer.files[0] && !e.target.closest("#drop")) upload(e.dataTransfer.files[0]); });

// ------------------------------------------------------------ project
const STEPS = [["downloading","Get video"],["transcribing","Transcribe"],["finding","Pick moments"],["rendering","Edit clips"]];
async function loadProject() {
  if (!cur) return;
  let p;
  try { p = await api("/api/projects/" + cur); } catch { $("#main").innerHTML = `<div class="wrap empty">That video is gone.</div>`; return; }
  const jobsFor = (ST?.jobs || []).filter(j => j.project === cur);
  const sig = JSON.stringify([p.status, p.title, p.error, p.clips.map(c => [c.state, c.file, c.title, c.error, c.start, c.end])]);
  if (sig !== lastSig) { lastSig = sig; P = p; renderProject(); }
  P = p;
  renderJob(jobsFor);
}
const scoreCls = s => s == null ? "you" : s >= 75 ? "hi" : s >= 55 ? "mid" : "lo";
function sorted() {
  const cs = [...P.clips];
  return SORT === "time" ? cs.sort((a, b) => a.start - b.start) : cs.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
}
function renderProject() {
  const cards = new Map();   // clip card id -> its HTML this time
  const p = P, busy = !["done","error","cancelled"].includes(p.status);
  const done = p.clips.filter(c => c.file).length;
  const sub = [p.source ? fmt(p.source.duration) + " long" : esc(p.input || ""), p.source?.uploader && esc(p.source.uploader),
    p.topic && `about “${esc(p.topic)}”`, p.span && `${fmt(p.span[0])}–${p.span[1] ? fmt(p.span[1]) : "end"}`,
    p.clips.length && `${done}/${p.clips.length} clips ready`].filter(Boolean).map(x => `<span>${x}</span>`).join("");
  // a poll re-render must not wipe what the user is typing, nor the transcript they are working in
  const typed = [...document.querySelectorAll(".editor.open input, .editor.open textarea")]
    .filter(e => e.value !== e.defaultValue).map(e => [e.id, e.value]);
  const txNode = $("#txwrap");
  // clip cards that didn't change keep their old element, so their video and picture aren't loaded again
  const oldCards = new Map([...document.querySelectorAll(".clip")].map(n => [n.id, n]));
  const canTx = !!p.source && !["queued","downloading","transcribing"].includes(p.status);
  if (!canTx && VIEW === "transcript") VIEW = "clips";
  $("#main").innerHTML = `<div class="wrap">
    <div class="phead">
      <div style="min-width:0"><h2>${esc(p.title)}</h2><div class="sub">${sub}</div></div>
      <div class="acts">
        ${done ? `<a class="btn pri" href="/api/projects/${p.id}/zip" title="Every clip + subtitles + post captions">${ic("down")}Download all</a>` : ""}
        ${done ? `<button class="ghost" onclick="api('/api/projects/${p.id}/open',{method:'POST'})">${ic("folder")}Open folder</button>` : ""}
        ${done && !busy ? `<button class="ghost" onclick="rerenderAll()" title="Re-edit every clip with your current settings">${ic("redo")}Re-render all</button>` : ""}
        ${!busy ? `<button class="ghost danger" onclick="delProject()" aria-label="Delete video">${ic("trash")}</button>` : ""}
      </div>
    </div>

function readForm() {
  const patch = {};
  document.querySelectorAll("#sbody [data-k]").forEach(el => {
    const k = el.dataset.k;
    patch[k] = el.type === "checkbox" ? el.checked : (el.type === "number" || el.type === "range") ? +el.value : k === "max_height" ? +el.value : el.value;
  });
  return patch;
}
function drawSettings(keep) {
  if (keep) Object.assign(S, readForm());
  $("#tabs").innerHTML = Object.keys(FIELDS).map(t => `<button class="${t === tab ? "on" : ""}" onclick="Object.assign(S,readForm());tab='${t}';drawSettings()">${t}</button>`).join("");
  $("#sbody").innerHTML = `<div class="fg">` + FIELDS[tab].map(f => {
    const [k, l, type, extra] = f;
    if (k === "h") return `<div class="h">${l}</div>`;
    if (k === "doctor") {
      if (!DOC) { loadDoctor(); return `<div class="empty" style="grid-column:1/-1"><div class="spin"></div>Checking everything…</div>`; }
      return `<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px">` + DOC.rows.map(r => `
        <div class="aibox" style="margin:0"><span class="dot ${r.ok ? "ok" : "bad"}"></span><b>${esc(r.name)}</b> — ${esc(r.detail)}
        ${!r.ok && r.hint ? `<div style="color:var(--mut)">${esc(r.hint)}</div>` : ""}
        ${r.fix === "chrome" ? `<button class="pri" style="margin-top:6px" onclick="fixChrome()">Download it now</button>` : ""}</div>`).join("")
        + `<button class="ghost" onclick="DOC=null;drawSettings(true)">${ic("redo")}Check again</button></div>`;
    }
    if (k === "ai") {
      if (!ST) return "";
      const a = ST.ai, om = a.omniroute, ol = a.ollama;
      return `<div class="aibox" style="grid-column:1/-1">
        <div><span class="dot ${om.ok ? "ok" : "bad"}"></span><b>OmniRoute</b> — ${om.ok ? "running, " + om.models.length + " models" : esc(om.error)}</div>
        <div><span class="dot ${ol.ok ? "ok" : "bad"}"></span><b>Ollama</b> — ${ol.ok ? (ol.pick ? "running, will use " + esc(ol.pick) : "running but no chat model – download one in App Hub › AI Models") : esc(ol.error)}</div>
        <div style="color:var(--mut)">Picking clips with: <b style="color:var(--text)">${a.provider === "none" ? "the built-in scorer (no AI running)" : esc(a.provider + " · " + a.model)}</b>
        <button class="ghost" style="padding:3px 10px;margin-left:8px" onclick="loadStatus(true).then(()=>drawSettings(true))">Check again</button></div></div>`;
    }
    const v = S[k];
    let input;
    if (type === "bool") input = `<label class="sw"><input type="checkbox" data-k="${k}" ${v ? "checked" : ""} aria-label="${esc(l)}"><span></span></label>`;
    else if (type === "sel") input = `<select data-k="${k}" aria-label="${esc(l)}">${(typeof extra === "function" ? extra() : extra).map(([ov, ol]) => `<option value="${ov}" ${String(v) === String(ov) ? "selected" : ""}>${ol}</option>`).join("")}</select>`;
    else if (type === "color") input = `<input type="color" data-k="${k}" value="${esc(v)}" style="width:70px;padding:3px;height:36px" aria-label="${esc(l)}">`;
    else if (type === "range") input = `<input type="range" min="0.03" max="0.4" step="0.01" data-k="${k}" value="${esc(v)}" style="width:200px;accent-color:var(--acc)" aria-label="${esc(l)}">`;
    else if (type === "num") input = `<input type="number" min="1" max="20" data-k="${k}" value="${esc(v)}" style="width:90px" aria-label="${esc(l)}">`;
    else input = `<input type="${type}" data-k="${k}" value="${esc(v)}" aria-label="${esc(l)}">`;
    let hint = type !== "sel" && typeof extra === "string" ? `<small>${esc(extra)}</small>` : "";
    if (extra === "music") hint = `<small>${ST && ST.music ? ST.music + " track(s) in data\\music" : "Put .mp3 files in data\\music first"} — ducked under the voice.
      <a href="#" onclick="event.preventDefault();api('/api/music/open',{method:'POST'})">Open music folder</a></small>`;
    return `<div><label>${l}</label>${hint}</div><div>${input}</div>`;
  }).join("") + `</div>`;
}
async function saveSettings() {
  Object.assign(S, readForm());
  S = await api("/api/settings", {method: "POST", body: JSON.stringify(S)});
  closeSettings(); toast("Saved"); loadStatus(true); if (!cur) home();
}

// ------------------------------------------------------------ keyboard
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "Escape") { closeSettings(); closePlayer(); return; }
  if (PN != null && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const list = sorted().filter(c => c.file), i = list.findIndex(c => c.n === PN), nx = list[i + (e.key === "ArrowRight" ? 1 : -1)];
    if (nx) openPlayer(nx.n);
    return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "n" && !e.ctrlKey && !e.metaKey) go("");
});

// ------------------------------------------------------------ poll
let ticking = false;
// Inside App Hub this page stays loaded on other pages; the hub says when it's off screen, so it stops polling.
let parked = false;
addEventListener('message', (e) => {
  if (e.source !== parent || !e.data || !('cfHidden' in e.data)) return;
  parked = !!e.data.cfHidden;
  if (!parked) tick();
});

async function tick() {
  if (ticking) return; ticking = true;
  try {
    if (!OPTS.caption_styles.length) {            // the first load raced the server starting up
      OPTS = await api("/api/options"); if (!cur) home();
    }
    await loadStatus();
    if (cur) await loadProject();
    const n = ST ? ST.jobs.length : 0;
    if (n || n !== tick.prev) loadList();
    tick.prev = n;
  } finally { ticking = false; }
}
(async () => {
  [S, OPTS] = await Promise.all([api("/api/settings").catch(() => ({})), api("/api/options").catch(() => OPTS)]);
  await Promise.all([loadStatus(), loadList()]);
  route();
  setInterval(() => { if (!document.hidden && !parked) tick(); }, 1500);
})();
</script>
</body>
</html>
